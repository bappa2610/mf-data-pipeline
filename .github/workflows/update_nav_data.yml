name: Update Mutual Fund Historical NAV Data

on:
  schedule:
    # EVERY 2 HOURS (UTC)
    - cron: '0 */2 * * *'
  workflow_dispatch:

jobs:
  update-amfi_mf_data:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests pandas

      - name: Create data directory
        run: mkdir -p data

      # -------- NAV TASKS --------

      - name: Fetch 
        run: python scripts\Export_scheme_data\v2\fetch_amfi_mf_data.py

      # -------- COMMIT & PUSH --------

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/
          git commit -m "Auto update MF NAV data" || echo "No changes"
          BRANCH=${GITHUB_REF#refs/heads/}
          git pull --rebase origin "$BRANCH" || true
          git push "https://$PAT_TOKEN@github.com/${{ github.repository }}" "HEAD:$BRANCH"
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
